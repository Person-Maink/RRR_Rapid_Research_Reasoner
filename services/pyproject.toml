[project]
name = "services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=26.3.1",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.3",
    "langchain>=1.2.15",
    "numpy>=2.2.6",
    "openai>=2.33.0",
    "pandas>=2.3.3",
    "pre-commit>=4.6.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pika>=1.3.2",
    "pypdf>=6.4.1",
    "python-multipart>=0.0.20",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.10",
    "uvicorn>=0.44.0",
]
# for formatting code 
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, flakes, imports
ignore = []

#for tests
[tool.black]
line-length = 88
target-version = ["py311"]
