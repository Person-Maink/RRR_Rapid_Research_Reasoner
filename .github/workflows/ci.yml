name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: services
        run: uv sync

      - name: Ruff
        working-directory: services
        run: >
          uv run ruff check
          api_gateway ingestion_service reasoning_service retrieval_service
          worker tests environment.py job_store.py logging_config.py queue.py
          storage.py vectorize.py ../shared

      - name: Black
        working-directory: services
        run: >
          uv run black --check
          api_gateway ingestion_service reasoning_service retrieval_service
          worker tests environment.py job_store.py logging_config.py queue.py
          storage.py vectorize.py ../shared

      - name: Pytest
        working-directory: services
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/frontend
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint infra/helm/rrr

      - name: Helm template
        run: helm template rrr infra/helm/rrr -f infra/helm/rrr/values-minikube.yaml

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - helm
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image prefix
        id: image
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/api:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/worker:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
