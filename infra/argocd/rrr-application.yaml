apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rapid-research-reasoner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/RRR_Rapid_Research_Reasoner.git
    targetRevision: main
    path: infra/helm/rrr
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rrr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
