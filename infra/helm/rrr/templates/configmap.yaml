apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rrr.fullname" . }}-config
  labels:
    {{- include "rrr.labels" . | nindent 4 }}
data:
  DATA_DIR: {{ .Values.storage.mountPath | quote }}
  FRONTEND_ORIGIN: {{ .Values.api.corsOrigin | quote }}
  POSTGRES_HOST: {{ include "rrr.fullname" . }}-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  RABBITMQ_URL: amqp://guest:guest@{{ include "rrr.fullname" . }}-rabbitmq:5672/%2F
  RABBITMQ_QUEUE: {{ .Values.rabbitmq.queue | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.api.maxUploadBytes | quote }}
