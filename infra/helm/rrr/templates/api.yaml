apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rrr.fullname" . }}-api
  labels:
    {{- include "rrr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "rrr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rrr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "rrr.fullname" . }}-config
            - secretRef:
                name: {{ include "rrr.fullname" . }}-secret
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.mountPath }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rrr.fullname" . }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rrr.fullname" . }}-api
  labels:
    {{- include "rrr.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rrr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
